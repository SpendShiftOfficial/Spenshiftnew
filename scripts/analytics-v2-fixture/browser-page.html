<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Synthetic analytics test</title><main><h1>Synthetic savings check</h1><p id="notice">Test notice: basic statistics and optional tracking are separate. No real customer data is used.</p><button id="accept">Accept optional</button><button id="reject">Reject optional</button><button id="off">Turn off basic statistics</button><button id="transition">Explicitly enable basic statistics under revised notice</button><button id="audit">Start test audit</button><button id="next">Next synthetic question</button><button id="reset">Reset test audit</button><p id="question" aria-live="polite"></p></main><script type="module">
import {browserCollector} from '/lib/analytics-v2/browser.mjs';
const c=browserCollector({enabled:!location.search.includes('disabled=1'),noticeVisible:()=>document.getElementById('notice').getClientRects().length>0});
let q=0,run;const update=()=>document.getElementById('question').textContent=q>8?'Synthetic results':q?'Question '+q:'';
const opt=(v,off=undefined,transition=false)=>c.choose({analytics:v,ads:v,basicOff:off,transition});
document.getElementById('accept').onclick=()=>opt('granted');document.getElementById('reject').onclick=()=>opt('denied');document.getElementById('off').onclick=()=>{opt('denied',true);c.withdraw();};document.getElementById('transition').onclick=()=>{if(opt('denied',false,true))c.entry();};
document.getElementById('audit').onclick=()=>{q=1;run=c.audit();run.arrive();run.see(q);update();};document.getElementById('next').onclick=()=>{if(q<1||q>8)return;run.choose(q);run.advance(q);q++;if(q===9){run.complete();c.record({v:2,event:'results_view'});}else run.see(q);update();};document.getElementById('reset').onclick=()=>{if(!run)return;run.reset();q=1;run.arrive();run.see(q);update();};
c.entry();document.addEventListener('visibilitychange',()=>c.entry());window.testCollector=c;
</script></html>
