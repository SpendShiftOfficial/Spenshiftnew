name: Isolated owner Auth and MFA verification
on:
  push:
    branches: [internal-analytics-v2-2026-11-25]
    paths:
      - '.github/workflows/analytics-v2-local-auth.yml'
      - 'scripts/analytics-v2-fixture/test-real-auth.mjs'
      - 'docs/analytics-v2/candidate-migration.sql'
      - 'docs/analytics-v2/candidate-release.sql'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  local_auth:
    if: github.ref == 'refs/heads/internal-analytics-v2-2026-11-25' && github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Install locked application dependencies
        run: npm ci
      - name: Actual local Supabase Auth (no project link or hosted credentials)
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          test "${GITHUB_REPOSITORY}" = "SpendShiftOfficial/Spenshiftnew"
          test "${GITHUB_REF}" = "refs/heads/internal-analytics-v2-2026-11-25"
          work="$(mktemp -d)"
          export SUPABASE_TELEMETRY_DISABLED=1
          unset SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD SUPABASE_URL SUPABASE_SERVICE_ROLE_KEY
          mkdir -p "$work/bin" "$work/local"
          curl --fail --silent --show-error --location --retry 2 https://github.com/supabase/cli/releases/download/v3.4.0/supabase_3.4.0_linux_amd64.tar.gz -o "$work/supabase.tar.gz"
          echo "d82f8fc8a1611c45b9422b10378f61df614325f7e25624acda3704544513d6ac  $work/supabase.tar.gz" | sha256sum --check --status
          tar -xzf "$work/supabase.tar.gz" -C "$work/bin" supabase
          cli="$work/bin/supabase"
          root="$GITHUB_WORKSPACE"
          cd "$work/local"
          "$cli" init >"$work/init.log" 2>&1
          # Local CLI defaults may disable TOTP. Enable enrollment and verification
          # ONLY in the fresh disposable config, never in a hosted project.
          "$cli" config convert --to toml --reason ci-or-deploy >"$work/convert.log" 2>&1
          python3 - <<'PY'
          from pathlib import Path
          import re, tomllib
          p = Path("supabase/config.toml")
          text = p.read_text()
          match = re.search(r"(?m)^\[auth\.mfa\.totp\][ \t]*$", text)
          if match:
              end = re.search(r"(?m)^\[", text[match.end():])
              stop = match.end() + end.start() if end else len(text)
              section = text[match.start():stop]
              for key in ("enroll_enabled", "verify_enabled"):
                  pat = rf"(?m)^\s*{key}\s*=\s*(?:true|false)[^\n]*$"
                  if re.search(pat, section):
                      section = re.sub(pat, key + " = true", section)
                  else:
                      section = section.rstrip() + "\n" + key + " = true\n"
              text = text[:match.start()] + section.rstrip() + "\n\n" + text[stop:]
          else:
              text += "\n[auth.mfa.totp]\nenroll_enabled = true\nverify_enabled = true\n"
          check = tomllib.loads(text)["auth"]["mfa"]["totp"]
          assert check["enroll_enabled"] is True and check["verify_enabled"] is True
          p.write_text(text)
          PY
          "$cli" config validate >"$work/config.log" 2>&1
          echo "Disposable TOTP enrollment and verification explicitly enabled."
          cleanup(){ "$cli" stop --no-backup >"$work/stop.log" 2>&1 || true; rm -rf "$work"; }
          trap cleanup EXIT
          # Local stack ONLY, fresh directory, no linked project, no application migrations.
          if ! "$cli" start -x realtime,storage-api,imgproxy,postgres-meta,studio,edge-runtime,logflare,vector,supavisor >"$work/start.log" 2>&1; then
            echo "Local Supabase stack could not start; no Auth pass is claimed."
            exit 1
          fi
          "$cli" status -o json >"$work/status.json" 2>"$work/status.log"
          cd "$root"
          # Only the fresh loopback database, validated again inside the test.
          SPENDSHIFT_LOCAL_AUTH_STATUS="$work/status.json" node --experimental-strip-types scripts/analytics-v2-fixture/test-real-auth.mjs
